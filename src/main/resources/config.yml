pyrofishing-integration:
  enabled: true
  anchor-hook-chance: 0.25              # live-fish bonus; only used when replace-catch is false
  replace-pyro-catch-with-model: true   # replace Pyro's reward with a hooked-fish model on ReelDeal rods
  debug: false                          # log how Pyro's reward was removed

weather-events:
  # Event rolls and selected events apply server-wide; no biome-specific checks are used.
  scheduler:
    check-interval-seconds: 300
    event-chance: 0.05                   # chance per check to schedule any one enabled event
  acid-rain:
    enabled: true
    display-name: "Acid Rain"
    weight: 1.0                          # relative chance among enabled events
    duration-seconds: 300
    effect-check-interval-seconds: 5
    effect-chance-per-check: 0.2         # per-player chance each time the hiss/particle cue is checked
    sound: "minecraft:block.fire.extinguish"
    sound-volume: 0.12                   # quiet; range 0.0-1.0
    sound-pitch: 0.85
    particle: FALLING_WATER
    particle-count: 4
    particle-height: 1.5
    particle-spread: 0.35
    particle-vertical-spread: 0.35
    particle-speed: 0.02
    require-sky-exposure: true
    weather-radio-interference: true
