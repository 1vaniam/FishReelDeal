weather-radio:
  warning-lead-minutes: 5                # chat warning time before a scheduled custom event
  interference-sound: "minecraft:block.redstone_torch.burnout"
  interference-volume: 0.1
  interference-pitch: 0.85

fishing:
  debug: false                          # log selected catch category and resolved result
  fish-tables:
    woven:                              # regular catches with woven/default line
      cod: 60
      salmon: 40
    common:                             # reinforced/fiber line and anchor-hook regular catches
      cod: 60
      salmon: 25
      pufferfish: 13
      tropical-fish: 2
  special-fish:
    weight: 1                           # relative chance added to fiber-line and anchor+fiber catches
    deep-max-y: 0                       # deepfish at or below this Y
    low-depth-max-y: 48                 # cobblefish above deep-max-y and at or below this Y
    deep-item: deepfish                 # item ID from items.json
    low-depth-item: cobblefish
    items:                              # item IDs from items.json for biome catches
      bullfish: bullfish
      fishroom: fishroom
      icehorn: icehorn
    enabled:
      bullfish: true
      fishroom: true
      icehorn: true
    biomes:                            # namespaced or vanilla biome names; empty uses built-in defaults
      bullfish: [swamp, mangrove_swamp]
      fishroom: [dark_forest, pale_garden, mushroom_fields]
      icehorn: [snowy_beach, snowy_plains, snowy_slopes, snowy_taiga, ice_spikes, frozen_peaks, frozen_river, taiga, old_growth_pine_taiga, old_growth_spruce_taiga, grove, meadow, stony_peaks, windswept_hills, windswept_forest, windswept_gravelly_hills]
  anchor-hook:
    mob-weights:                        # weighted among eligible catches; 5 is about 4.8% in a typical river/ocean
      squid: 5
      dolphin: 5
      glow-squid: 20
      frog: 20
    fish-weights:                       # anchor hook's regular fish outcomes
      cod: 60
      salmon: 25
      pufferfish: 13
      tropical-fish: 2
    special-fish-weight: 1
    eligibility:
      squid-biomes: [river, frozen_river]
      dolphin-biomes: [ocean, cold_ocean, frozen_ocean, deep_ocean, deep_cold_ocean, deep_frozen_ocean, warm_ocean, lukewarm_ocean, deep_lukewarm_ocean]
      frog-biomes: [swamp, mangrove_swamp]
      glow-squid-max-y: 32
  skyhook:
    minimum-y: 128                      # Skyhook can be found at this height or above
    require-open-sky: true               # prevents finding it under roofs or inside caves
    loot-table:                         # only used by rods fitted with the Skyhook
      - material: FEATHER
        weight: 60
        min-amount: 1
        max-amount: 4
      - material: PHANTOM_MEMBRANE
        weight: 25
        min-amount: 1
        max-amount: 2
      - material: WIND_CHARGE
        weight: 15
        min-amount: 1
        max-amount: 2
  xp-hook:
    bonus: 3                            # extra experience points for each successful fish catch
    pyrofishing-tier-bonuses:           # total XP Hook bonus for custom Pyro catches (minimum is bonus above)
      bronze: 5
      silver: 10
      gold: 20
      diamond: 30
      platinum: 100
      mythical: 1000
  category-weights:
    default:                            # relative weights for standard fishing
      junk: 10
      treasure: 5
      fish: 85
    hooks:
      wooden_hook:                      # preserves its junk-only behavior by default
        junk: 100
        treasure: 0
        fish: 0
      golden_hook:                      # halves junk weight and doubles treasure weight
        junk: 5
        treasure: 10
        fish: 85
      cluster_hook:
        underground-max-y: 48
        underground-mineral-weight: 85

barrel-catch:
  enabled: true
  base-chance: 0.01                     # 1% before the selected hook's multiplier
  catch-message: "<gold><bold>BARREL!</bold></gold> <yellow>You fished up a barrel! Break it open — it might contain some treasure.</yellow>"
  hits-to-open: 5                        # player attacks the flying barrel entity this many times
  drowned-chance: 10.0                   # percent chance a Drowned emerges when a barrel opens; 0-100
  loot-table:                           # each opened barrel rolls one weighted entry
    - material: STRING
      weight: 18
      min-amount: 2
      max-amount: 6
    - material: COOKED_COD
      weight: 14
      min-amount: 1
      max-amount: 3
    - material: COAL
      weight: 14
      min-amount: 2
      max-amount: 6
    - material: IRON_INGOT
      weight: 14
      min-amount: 1
      max-amount: 3
    - material: PRISMARINE_SHARD
      weight: 12
      min-amount: 2
      max-amount: 6
    - material: LAPIS_LAZULI
      weight: 10
      min-amount: 3
      max-amount: 8
    - material: GOLD_INGOT
      weight: 8
      min-amount: 1
      max-amount: 2
    - material: NAUTILUS_SHELL
      weight: 4
      min-amount: 1
      max-amount: 1
    - material: EMERALD
      weight: 4
      min-amount: 1
      max-amount: 1
    - material: DIAMOND
      weight: 2
      min-amount: 1
      max-amount: 1
    - material: HEART_OF_THE_SEA
      weight: 3
      min-amount: 1
      max-amount: 1
    - item: xp_hook                     # super-rare custom hook; added to existing configs automatically
      weight: 1
      min-amount: 1
      max-amount: 1
  placeholder-loot: CHEST               # fallback if the loot table is empty or invalid
  hitbox-mob: TURTLE                    # invisible hitbox; the visible model is a vanilla barrel
  hitbox-scale: 0.8
  model-scale: 0.8
  fling-speed: 1.1
  despawn-seconds: 45
  debug: false                          # log every barrel chance roll and catch-event status
  hook-multipliers:
    normal: 1.0
    wooden_hook: 1.0
    iron_hook: 1.0
    golden_hook: 2.0                    # golden hooks favor treasure-like catches
    cluster_hook: 1.0
    anchor_hook: 1.0

rod-add-lore:
  mode: full
  summary:
    line-label: "Line"
    hook-label: "Hook"
    color: "dark_aqua"

hooked-fish:                    # supported Pyro catches become 3D models flung at the player
  enabled: true
  despawn-seconds: 60           # removed if nobody kills it
  despawn-message: "Your fish flopped back to the water!" # empty string disables the timeout message
  health: 4.0                   # hits needed to "kill" it
  hitbox-mob: TURTLE            # invisible mob used as hitbox (wide and flat like a fish; peaceful-safe)
  hitbox-scale: 0.7             # scales the hitbox (turtle base is 1.2 wide x 0.4 tall)
  hitbox-y-offset: 0.3          # mob height above the hook when spawned
  display-y-offset: 0.0         # extra model lift; the model already sits on the mob's feet
  model-scale: 0.8
  fling-speed: 1.1
  yaw-offset: 0.0               # rotate the model if it faces the wrong way
  pickup-shows-model: true      # shift + right-click (empty hand) picks the fish up as the 3D model item
  size:                         # random size: bigger = rarer. Length is shown in cm on the item.
    enabled: true
    min-scale: 0.25             # scale at the smallest length (tiny min-cm)
    max-scale: 5.0              # scale at the largest length (trophy max-cm)
    trophy-skew: 2.0            # higher = huge trophies rarer inside the trophy tier
    anchor-tier-shift: 1        # anchor_hook shifts the rolled fish up this many size tiers
    tiers:                      # weight = relative chance of rolling that tier
      tiny:    {min-cm: 3,   max-cm: 8,   weight: 25}
      small:   {min-cm: 10,  max-cm: 25,  weight: 35}
      medium:  {min-cm: 28,  max-cm: 61,  weight: 28}
      large:   {min-cm: 64,  max-cm: 102, weight: 10}
      trophy:  {min-cm: 104, max-cm: 150, weight: 2}
