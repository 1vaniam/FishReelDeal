pyrofishing-integration:
  enabled: true
  anchor-hook-chance: 0.25              # live-fish bonus; only used when replace-catch is false
  replace-pyro-catch-with-model: true   # replace Pyro's reward with a hooked-fish model on ReelDeal rods
  debug: false                          # log how Pyro's reward was removed

weather-events:
  # Event rolls and selected events apply server-wide; no biome-specific checks are used.
  scheduler:
    check-interval-seconds: 300
    event-chance: 0.05                   # chance per check to schedule any one enabled event
  acid-rain:
    enabled: true
    weight: 1.0                          # relative chance among enabled events
    duration-seconds: 300
    effect-check-interval-seconds: 5
    effect-chance-per-check: 0.2         # per-player chance each time the hiss/particle cue is checked
    sound: "minecraft:block.fire.extinguish"
    sound-volume: 0.12                   # quiet; range 0.0-1.0
    sound-pitch: 0.85
    weather-radio-interference: true
  pollen-drift:
    enabled: true
    weight: 1.0
    duration-seconds: 300
    effect-check-interval-seconds: 8
    effect-chance-per-check: 0.2
    sound: "minecraft:block.azalea_leaves.hit"
    sound-volume: 0.08
    sound-pitch: 1.0
    particle-count: 5
    weather-radio-interference: true
  ashfall:
    enabled: true
    weight: 1.0
    duration-seconds: 300
    effect-check-interval-seconds: 8
    effect-chance-per-check: 0.2
    sound: "minecraft:block.sand.fall"
    sound-volume: 0.08
    sound-pitch: 0.9
    particle-count: 5
    weather-radio-interference: true
  cold-snap:
    enabled: true
    weight: 1.0
    duration-seconds: 300
    effect-check-interval-seconds: 10
    effect-chance-per-check: 0.2
    sound: "minecraft:block.powder_snow.step"
    sound-volume: 0.07
    sound-pitch: 0.9
    particle-count: 3
    weather-radio-interference: true
  dust-haze:
    enabled: true
    weight: 1.0
    duration-seconds: 300
    effect-check-interval-seconds: 8
    effect-chance-per-check: 0.18
    sound: "minecraft:block.sand.idle"
    sound-volume: 0.06
    sound-pitch: 0.8
    particle-count: 4
    weather-radio-interference: true
  firefly-night:
    enabled: true
    weight: 1.0
    duration-seconds: 300
    effect-check-interval-seconds: 8
    effect-chance-per-check: 0.2
    sound: "minecraft:block.amethyst_block.chime"
    sound-volume: 0.06
    sound-pitch: 1.35
    particle-count: 2
    weather-radio-interference: true
  meteor-dust:
    enabled: true
    weight: 1.0
    duration-seconds: 300
    effect-check-interval-seconds: 15
    effect-chance-per-check: 0.1
    sound: "minecraft:entity.firework_rocket.twinkle_far"
    sound-volume: 0.08
    sound-pitch: 0.8
    particle-count: 2
    weather-radio-interference: true
  spore-bloom:
    enabled: true
    weight: 1.0
    duration-seconds: 300
    effect-check-interval-seconds: 8
    effect-chance-per-check: 0.2
    sound: "minecraft:block.spore_blossom.fall"
    sound-volume: 0.08
    sound-pitch: 0.9
    particle-count: 4
    weather-radio-interference: true
  magnetic-disturbance:
    enabled: true
    weight: 1.0
    duration-seconds: 300
    effect-check-interval-seconds: 12
    effect-chance-per-check: 0.15
    sound: "minecraft:block.amethyst_block.resonate"
    sound-volume: 0.08
    sound-pitch: 0.7
    particle-count: 2
    weather-radio-interference: true
weather-radio:
  warning-lead-minutes: 5                # chat warning time before a scheduled custom event
  interference-sound: "minecraft:block.redstone_torch.burnout"
  interference-volume: 0.1
  interference-pitch: 0.85

fishing:
  debug: false                          # log selected catch category and resolved result
  anchor-hook:
    mob-weights:                        # weighted among eligible catches; 5 is about 4.8% in a typical river/ocean
      squid: 5
      dolphin: 5
  category-weights:
    default:                            # relative weights for standard fishing
      junk: 10
      treasure: 5
      fish: 85
    hooks:
      wooden_hook:                      # preserves its junk-only behavior by default
        junk: 100
        treasure: 0
        fish: 0
      golden_hook:                      # halves junk weight and doubles treasure weight
        junk: 5
        treasure: 10
        fish: 85
      cluster_hook:
        underground-max-y: 48
        underground-mineral-weight: 85

barrel-catch:
  enabled: true
  base-chance: 0.01                     # 1% before the selected hook's multiplier
  catch-message: "<gold><bold>BARREL!</bold></gold> <yellow>You fished up a barrel! Break it open — it might contain some treasure.</yellow>"
  hits-to-open: 5                        # player attacks the flying barrel entity this many times
  drowned-chance: 10.0                   # percent chance a Drowned emerges when a barrel opens; 0-100
  loot-table:                           # each opened barrel rolls one weighted entry
    - material: STRING
      weight: 18
      min-amount: 2
      max-amount: 6
    - material: COOKED_COD
      weight: 14
      min-amount: 1
      max-amount: 3
    - material: COAL
      weight: 14
      min-amount: 2
      max-amount: 6
    - material: IRON_INGOT
      weight: 14
      min-amount: 1
      max-amount: 3
    - material: PRISMARINE_SHARD
      weight: 12
      min-amount: 2
      max-amount: 6
    - material: LAPIS_LAZULI
      weight: 10
      min-amount: 3
      max-amount: 8
    - material: GOLD_INGOT
      weight: 8
      min-amount: 1
      max-amount: 2
    - material: NAUTILUS_SHELL
      weight: 4
      min-amount: 1
      max-amount: 1
    - material: EMERALD
      weight: 4
      min-amount: 1
      max-amount: 1
    - material: DIAMOND
      weight: 2
      min-amount: 1
      max-amount: 1
  placeholder-loot: CHEST               # fallback if the loot table is empty or invalid
  hitbox-mob: TURTLE                    # invisible hitbox; the visible model is a vanilla barrel
  hitbox-scale: 0.8
  model-scale: 0.8
  fling-speed: 1.1
  despawn-seconds: 45
  debug: false                          # log every barrel chance roll and catch-event status
  hook-multipliers:
    normal: 1.0
    wooden_hook: 1.0
    iron_hook: 1.0
    golden_hook: 2.0                    # golden hooks favor treasure-like catches
    cluster_hook: 1.0
    anchor_hook: 1.0

rod-add-lore:
  mode: full
  summary:
    line-label: "Line"
    hook-label: "Hook"
    color: "dark_aqua"

hooked-fish:                    # supported Pyro catches become 3D models flung at the player
  enabled: true
  despawn-seconds: 60           # removed if nobody kills it
  despawn-message: "Your fish flopped back to the water!" # empty string disables the timeout message
  health: 4.0                   # hits needed to "kill" it
  hitbox-mob: TURTLE            # invisible mob used as hitbox (wide and flat like a fish; peaceful-safe)
  hitbox-scale: 0.7             # scales the hitbox (turtle base is 1.2 wide x 0.4 tall)
  hitbox-y-offset: 0.3          # mob height above the hook when spawned
  display-y-offset: 0.0         # extra model lift; the model already sits on the mob's feet
  model-scale: 0.8
  fling-speed: 1.1
  yaw-offset: 0.0               # rotate the model if it faces the wrong way
  pickup-shows-model: true      # shift + right-click (empty hand) picks the fish up as the 3D model item
  size:                         # random size: bigger = rarer. Length is shown in cm on the item.
    enabled: true
    min-scale: 0.25             # scale at the smallest length (tiny min-cm)
    max-scale: 5.0              # scale at the largest length (trophy max-cm)
    trophy-skew: 2.0            # higher = huge trophies rarer inside the trophy tier
    anchor-tier-shift: 1        # anchor_hook shifts the rolled fish up this many size tiers
    tiers:                      # weight = relative chance of rolling that tier
      tiny:    {min-cm: 3,   max-cm: 8,   weight: 25}
      small:   {min-cm: 10,  max-cm: 25,  weight: 35}
      medium:  {min-cm: 28,  max-cm: 61,  weight: 28}
      large:   {min-cm: 64,  max-cm: 102, weight: 10}
      trophy:  {min-cm: 104, max-cm: 150, weight: 2}
