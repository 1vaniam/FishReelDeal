# ReelDeal quest line
# Add entries below and run /reel reload. Players access and claim quests only through the Quest Keeper NPC.
# Objective types: catches, hook-catches, line-catches, hook-line-catches, biome-catches, item-catches,
# mob-catches, open-water-catches, barrels-opened, hooked-fish, fish-size, pyro-tier, weather-catches,
# catch-categories (fish, junk, treasure, mineral, sky, mob), frostwake-defeats, radio-checks,
# workbench-upgrades.
# Rewards support experience, vanilla materials, ReelDeal item IDs, and console commands.
npc:
  name: "Quest Keeper"
  follow:
    enabled: true
    range: 32.0
    head-rotation-speed: 30.0
    max-head-pitch: 45.0
    check-interval-ticks: 10

